name: vidalys-flow

x-app: &app
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
    SECRET_KEY: ${SECRET_KEY:-local-compose-development-key}
    DATABASE_URL: postgresql://vidalys_flow:vidalys_flow@db:5432/vidalys_flow
    CELERY_BROKER_URL: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis:6379/1
    VIDALYS_DEMO_MODE: "1"
    ALLOWED_HOSTS: localhost,127.0.0.1,web
    CSRF_TRUSTED_ORIGINS: http://localhost:8000
  restart: unless-stopped

services:
  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - .venv/bin/gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=4
      - --timeout=60
      - --no-control-socket
      - --access-logfile=-
      - --error-logfile=-
    ports:
      - "127.0.0.1:${VIDALYS_WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker-default:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [".venv/bin/celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=default"]
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/celery -A config inspect ping -d \"celery@$$HOSTNAME\" --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  beat:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      [
        ".venv/bin/celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    healthcheck:
      test: ["CMD-SHELL", "case \"$$(tr '\\0' ' ' < /proc/1/cmdline)\" in *'celery -A config beat'*) exit 0 ;; *) exit 1 ;; esac"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    <<: *app
    command: [".venv/bin/python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vidalys_flow
      POSTGRES_USER: vidalys_flow
      POSTGRES_PASSWORD: vidalys_flow
    volumes:
      - vidalys_flow_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidalys_flow -d vidalys_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vidalys_flow_postgres:
