name: Foundation CI

on:
  push:
    branches:
      - main
      - foundation/independent-core
      - domain/customers-products
      - chore/agent-orchestration
      - "phase/**"
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vidalys_test
          POSTGRES_USER: vidalys_test
          POSTGRES_PASSWORD: vidalys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidalys_test -d vidalys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-not-a-runtime-secret
      DATABASE_URL: postgresql://vidalys_test:vidalys_test@127.0.0.1:5432/vidalys_test
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      VIDALYS_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Governance JSON syntax
        run: find project -name '*.json' -print0 | sort -z | xargs -0 -n1 uv run python -m json.tool > /dev/null
      - name: Governance state and roadmap
        run: |
          uv run python scripts/agent_orchestrator.py validate-state
          uv run python scripts/agent_orchestrator.py validate-roadmap
      - name: Governance manifests and handoffs
        run: uv run python scripts/agent_orchestrator.py validate-all
      - name: Governance prompt versioning
        run: uv run python scripts/agent_orchestrator.py validate-templates
      - name: Approved phase ancestry and governance baseline
        run: |
          baseline_branch="$(uv run python -c 'import json; print(json.load(open("project/state.json"))["baseline_branch"])')"
          ref_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git fetch --no-tags origin "${baseline_branch}:refs/remotes/origin/${baseline_branch}"
          uv run python scripts/check_governance_baseline.py \
            --head HEAD \
            --ref-name "$ref_name" \
            --baseline-ref "origin/${baseline_branch}"
      - name: Orchestrator tests
        run: uv run pytest tests/test_agent_orchestrator.py
      - name: Secret scan
        run: uv run python scripts/check_secrets.py
      - name: Independence scan
        run: uv run python scripts/check_independence.py
      - name: Ruff
        run: uv run ruff check .
      - name: Django check
        run: uv run python manage.py check
      - name: Migration consistency
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Apply new migrations to empty PostgreSQL 17
        run: uv run python manage.py migrate --noinput
      - name: Technical rollback and reapply Fulfillment migration
        run: |
          uv run python manage.py migrate fulfillment zero --noinput
          uv run python manage.py migrate fulfillment --noinput
      - name: Technical rollback and reapply Payments migration
        run: |
          uv run python manage.py migrate payments zero --noinput
          uv run python manage.py migrate payments --noinput
      - name: Tests and coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report
      - name: Docker build
        run: docker build -t vidalys-flow:foundation .
      - name: Compose validation
        run: |
          docker compose config
          docker compose -f docker-compose.test.yml config
      - name: Celery runtime topology
        run: uv run python scripts/check_celery_runtime.py
